[package]
name = "temor-ui"
description = "temor's window: the terminal pane, its input, and the app's edges (PTY I/O thread, settings file, opener)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# The Linux desktop's services (PLAN D15): the agent layer, single instance, the dock badge and the
# Tailscale list. Off, temor-desktop is its portable half and the build has no zbus.
default = ["quire-desktop"]
quire-desktop = ["temor-client/quire-desktop"]

[dependencies]
anyview-core = { workspace = true }
anyview-fs = { workspace = true }
anyview-peek = { workspace = true, features = ["pane"] }
anyview-machines = { workspace = true }
anyview-pane = { workspace = true }
chordkit = { workspace = true }
dioxus = { workspace = true }
ds = { workspace = true }
ds-blitz = { workspace = true }
ds-core = { workspace = true }
ds-settings = { workspace = true, features = ["dioxus"] }
ds-settings-page = { workspace = true }
png = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
# temor, as the window may name it (PLAN §2b, the fence): its data and services through the
# client, the running terminals and their engine through temor-panes, the data's types.
temor-client = { workspace = true }
temor-panes = { workspace = true }
temor-schema = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
unicode-width = { workspace = true }

[dev-dependencies]
# The tests drive the window against real panes, helpers and desktop ports, so they name the
# crates under the fence directly; the window itself does not.
temor-core = { workspace = true }
temor-desktop = { workspace = true }
temor-pty = { workspace = true }
temor-remote = { workspace = true, features = ["ghostty"] }
temor-shell = { workspace = true }
temor-ssh = { workspace = true }
temor-pane = { workspace = true, features = ["ghostty"] }
temor-plugins = { workspace = true }
temor-transfer = { workspace = true }
temor-render = { workspace = true, features = ["ghostty"] }
temor-vt = { workspace = true, features = ["ghostty"] }
temor-wire = { workspace = true }
temor-testkit = { workspace = true }
ds-harness = { workspace = true }
ds-lint = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
