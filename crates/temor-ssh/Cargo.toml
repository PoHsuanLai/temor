[package]
name = "temor-ssh"
description = "temor's SSH, Tier A: the host list from ssh_config, connection sharing argv, the POSIX bootstrap sent with each connection, and host identity. Pure builders; the system ssh does the work."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
temor-pty = { path = "../temor-pty" }
thiserror = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
