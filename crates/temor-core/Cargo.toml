[package]
name = "temor-core"
description = "temor's pure core: vocabulary, the split tree, the step machines, the command-bar ranking and proposal sanitising. No I/O, no threads, no UI."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The data as types (L0): ids and named text live there and are re-exported from `vocab`.
temor-schema = { workspace = true }
temor-pane = { workspace = true, default-features = false }
ds-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
ds-core = { workspace = true, features = ["testing"] }
proptest = { workspace = true }

[lints]
workspace = true
