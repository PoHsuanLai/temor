[package]
name = "temor-blocks"
description = "temor's rules for a shell session and its blocks (sans I/O): the shell's state and marks, the blocks it ran, the notices it raises, the command offer, and sanitising what a model proposes."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
temor-core = { workspace = true }
temor-schema = { workspace = true }
temor-shell = { workspace = true }
temor-pane = { workspace = true, default-features = false }
ds-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
temor-testkit = { workspace = true }
ds-core = { workspace = true, features = ["testing"] }
icu_properties = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
