[package]
name = "temor-pane"
description = "temor's terminal pane engine: a program on a pty, its terminal under one lock, and the I/O loop that feeds it, plus the pure key, settings, text and paste rules. No UI, no async runtime."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["ghostty"]
# What runs: a program on a pty, the files it sends, and each pane's status socket. Without it the
# crate is the pure key, settings, text and paste rules and the status protocol, for the model
# crates that name them (PLAN §2: L2 does no I/O).
engine = [
    "dep:temor-pty",
    "dep:temor-transfer",
    "dep:rustix",
    "dep:nix",
    "temor-shell/io",
]
# The engine and the shell pane: they run libghostty (through temor-vt) and draw with temor-render's
# palette.
ghostty = [
    "engine",
    "dep:temor-vt",
    "dep:temor-render",
    "temor-vt/ghostty",
    "temor-render/ghostty",
]

[dependencies]
chordkit = { workspace = true }
percent-encoding = { workspace = true }
temor-pty = { workspace = true, optional = true }
temor-shell = { workspace = true }
# Files the program sends (OSC 1337, OSC 5113): decoded and staged here, shelved by the window.
temor-transfer = { workspace = true, optional = true }
# `SO_PEERCRED` for the status socket (the `net` feature joins the workspace set here).
rustix = { workspace = true, features = ["net"], optional = true }
temor-render = { workspace = true, optional = true }
temor-vt = { workspace = true, optional = true }
thiserror = { workspace = true }
# The settings file reads the numbers straight into the types below, with their limits.
serde = { workspace = true }

# `LOCAL_PEERCRED` for the status socket on macOS (`SO_PEERCRED` is Linux's).
[target.'cfg(target_os = "macos")'.dependencies]
nix = { workspace = true, optional = true }

[dev-dependencies]
temor-testkit = { workspace = true }
tempfile = { workspace = true }

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
