# Memory-lean builds (see the "Memory and build enforcement" section of the program plan).
# Link with mold through clang; never set RUSTFLAGS per agent, or sccache stops hitting.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[profile.dev]
opt-level = 0
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true

# Dependencies carry no debug info (a backtrace still names their functions), and a test build
# neither keeps an incremental cache nor debug info: every rebuild of a test binary (some are
# hundreds of MB) leaves the old one in target/debug/deps, so these are what make a target grow.
# Clear old builds now and then with `cargo sweep --time 3`.
[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 0
incremental = false

# The system git client honours the machine's network setup; libgit2 is much slower on the
# large blitz history.
[net]
git-fetch-with-cli = true
