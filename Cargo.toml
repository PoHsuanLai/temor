[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.dependencies]
# quire, pinned the desktop-wide way (.git + full rev; the tag is a comment).
ds = { git = "https://github.com/PoHsuanLai/quire.git", rev = "c404fb07d5a135273cca97adb3454ed0cbc9c755" }  # v0.3.14
ds-core = { git = "https://github.com/PoHsuanLai/quire.git", rev = "c404fb07d5a135273cca97adb3454ed0cbc9c755" }  # v0.3.14
ds-style = { git = "https://github.com/PoHsuanLai/quire.git", rev = "c404fb07d5a135273cca97adb3454ed0cbc9c755" }  # v0.3.14
ds-blitz = { git = "https://github.com/PoHsuanLai/quire.git", rev = "c404fb07d5a135273cca97adb3454ed0cbc9c755" }  # v0.3.14
ds-desktop = { git = "https://github.com/PoHsuanLai/quire.git", rev = "c404fb07d5a135273cca97adb3454ed0cbc9c755" }  # v0.3.14
ds-intents = { git = "https://github.com/PoHsuanLai/quire.git", rev = "c404fb07d5a135273cca97adb3454ed0cbc9c755" }  # v0.3.14
ds-harness = { git = "https://github.com/PoHsuanLai/quire.git", rev = "c404fb07d5a135273cca97adb3454ed0cbc9c755" }  # v0.3.14
ds-lint = { git = "https://github.com/PoHsuanLai/quire.git", rev = "c404fb07d5a135273cca97adb3454ed0cbc9c755" }  # v0.3.14
ds-settings = { git = "https://github.com/PoHsuanLai/quire.git", rev = "c404fb07d5a135273cca97adb3454ed0cbc9c755" }  # v0.3.14
# Copied from quire/docs/workspace-deps.toml at the rev above.
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "hooks", "signals"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proptest = "1"
# The Unicode property oracle in temor-core's sanitising tests (dev only).
icu_properties = "2"
png = "0.18"
# temor-vt (lane vt).
temor-vt-sys = { path = "crates/temor-vt-sys", default-features = false }
temor-vt = { path = "crates/temor-vt", default-features = false }
# temor-render (lane render). Versions are the ones quire's tree resolves at the pin above:
# fontique as parley 0.11 uses it, swash on the same skrifa (0.44) as vello's glifo, vello_cpu 0.1
# (the patched fork below; no second vello), wgpu 29 as quire's render stack.
fontique = "0.11"
swash = "0.2"
vello_cpu = { version = "0.1", default-features = false, features = ["std", "text", "u8_pipeline"] }
wgpu = "29"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
temor-render = { path = "crates/temor-render", default-features = false }
temor-ssh = { path = "crates/temor-ssh" }
# temor's app crates (lane app): the pure core, the pseudo-terminal, and the window.
temor-core = { path = "crates/temor-core" }
temor-pty = { path = "crates/temor-pty" }
temor-shell = { path = "crates/temor-shell" }
temor-pane = { path = "crates/temor-pane", default-features = false }
temor-ui = { path = "crates/temor-ui" }
# temor-transfer (lane blocks): the downloads shelf's store, for "Save output".
temor-transfer = { path = "crates/temor-transfer" }
tokio = { version = "1", default-features = false, features = ["sync"] }
# temor-remote (lane remote): the wire protocol it speaks, and SHA-256 for file stamps and the helper's identity.
temor-wire = { path = "crates/temor-wire" }
# temor-ui (lane remote): the helper's client, for Tier B sessions in the window.
temor-remote = { path = "crates/temor-remote" }
sha2 = "0.10"
# The desktop's portable keymap core (actions, chords, Primary per platform); temor owns no keymap.
# anyview's viewer pane and peeks (PLAN §10, D13). Same quire as above.
anyview-core = { git = "https://github.com/PoHsuanLai/anyview.git", rev = "be8c91cb958c6537df49508df4f973d8b16ad35b" }
anyview-fs = { git = "https://github.com/PoHsuanLai/anyview.git", rev = "be8c91cb958c6537df49508df4f973d8b16ad35b" }
anyview-peek = { git = "https://github.com/PoHsuanLai/anyview.git", rev = "be8c91cb958c6537df49508df4f973d8b16ad35b" }
anyview-pane = { git = "https://github.com/PoHsuanLai/anyview.git", rev = "be8c91cb958c6537df49508df4f973d8b16ad35b" }
chordkit = { git = "https://github.com/PoHsuanLai/chordkit.git", rev = "ba094c62006c280ac53c4c5df5c0e639c1226c07" }
# The desktop shortcut sources (temor-ui reads kdeglobals and a dconf dump through them).
chordkit-gnome = { git = "https://github.com/PoHsuanLai/chordkit.git", rev = "ba094c62006c280ac53c4c5df5c0e639c1226c07" }
chordkit-kde = { git = "https://github.com/PoHsuanLai/chordkit.git", rev = "ba094c62006c280ac53c4c5df5c0e639c1226c07" }

# temor-desktop (lane desktop): the only crate that names zbus, docket or porter-client (PLAN §2).
# docket 7457399 locks porter 3356848, so docket and porter-client share
# one porter-core. porter-client is feature `dbus` only: no inference, no stoker.
temor-desktop = { path = "crates/temor-desktop", default-features = false }
docket-client = { git = "https://github.com/PoHsuanLai/docket.git", rev = "312cd2710dafa8633b84fd8fab819227aac6bf31", default-features = false, features = ["dbus"] }
docket-core = { git = "https://github.com/PoHsuanLai/docket.git", rev = "312cd2710dafa8633b84fd8fab819227aac6bf31" }
prov = { git = "https://github.com/PoHsuanLai/porter.git", rev = "83ac0fa6fd890c7f0ca38d98ce917c0c5a0913f2" }
porter-core = { git = "https://github.com/PoHsuanLai/porter.git", rev = "83ac0fa6fd890c7f0ca38d98ce917c0c5a0913f2" }
porter-client = { git = "https://github.com/PoHsuanLai/porter.git", rev = "83ac0fa6fd890c7f0ca38d98ce917c0c5a0913f2", default-features = false, features = ["dbus"] }
# zbus on tokio, as docket and porter build it (quire CONSUMING §1: a program that owns a tokio runtime).
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
toml = "1"
# The tests of temor-desktop read bus signals as streams.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# temor-pty: openpty, spawn, resize and process groups without `unsafe` (rustix is already in quire's tree).
rustix = { version = "1.1", default-features = false, features = ["std", "pty", "termios", "process", "fs", "event"] }
tempfile = "3"

# Patches apply only at a workspace root, so this root repeats quire's block verbatim.
# vello and anyrender come from our forks (github.com/PoHsuanLai/vello and /anyrender, branch
# quire-filters): the colour matrix filter, multi-threaded filter layers and CSS filter lists, so
# every CSS `filter` function paints on both backends. Move back to crates.io once upstream has
# them (blitz-kit docs/blitz-gaps.md tracks the PRs).
[patch.crates-io]
vello_common = { git = "https://github.com/PoHsuanLai/vello", rev = "1722f6234e10b95d574d2252698a6cc7cdcadb82" }
vello_cpu = { git = "https://github.com/PoHsuanLai/vello", rev = "1722f6234e10b95d574d2252698a6cc7cdcadb82" }
vello_hybrid = { git = "https://github.com/PoHsuanLai/vello", rev = "1722f6234e10b95d574d2252698a6cc7cdcadb82" }
vello_sparse_shaders = { git = "https://github.com/PoHsuanLai/vello", rev = "1722f6234e10b95d574d2252698a6cc7cdcadb82" }
glifo = { git = "https://github.com/PoHsuanLai/vello", rev = "1722f6234e10b95d574d2252698a6cc7cdcadb82" }
anyrender = { git = "https://github.com/PoHsuanLai/anyrender", rev = "a0825ebfc0443f3ef0830c0e09f2d85df3da632b" }
anyrender_vello_cpu = { git = "https://github.com/PoHsuanLai/anyrender", rev = "a0825ebfc0443f3ef0830c0e09f2d85df3da632b" }
anyrender_vello_hybrid = { git = "https://github.com/PoHsuanLai/anyrender", rev = "a0825ebfc0443f3ef0830c0e09f2d85df3da632b" }
wgpu_context = { git = "https://github.com/PoHsuanLai/anyrender", rev = "a0825ebfc0443f3ef0830c0e09f2d85df3da632b" }
pixels_window_renderer = { git = "https://github.com/PoHsuanLai/anyrender", rev = "a0825ebfc0443f3ef0830c0e09f2d85df3da632b" }
# dioxus-core 0.7.10 can spin forever in VirtualDom::wait_for_work: a task woken and then cancelled
# before it is polled (a use_resource restart) leaves an empty entry in the dirty-task queue that
# pop_task never removes. Fixed upstream in DioxusLabs/dioxus#5554 (0.8-alpha only); this fork
# (github.com/PoHsuanLai/dioxus, branch quire-0.7) backports it onto 0.7.10. Remove when quire
# moves to dioxus 0.8.
dioxus-core = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
dioxus-core-types = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
generational-box = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
subsecond = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
subsecond-types = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
