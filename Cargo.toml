[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.dependencies]
# quire, pinned the desktop-wide way (.git + full rev; the tag is a comment).
ds = { git = "https://github.com/PoHsuanLai/quire.git", rev = "9ddcbceecbb2490526a2f5a2f3344334333d72be" }  # v0.3.33 (blitz 4b236792)
ds-core = { git = "https://github.com/PoHsuanLai/quire.git", rev = "9ddcbceecbb2490526a2f5a2f3344334333d72be" }  # v0.3.33 (blitz 4b236792)
ds-style = { git = "https://github.com/PoHsuanLai/quire.git", rev = "9ddcbceecbb2490526a2f5a2f3344334333d72be" }  # v0.3.33 (blitz 4b236792)
ds-blitz = { git = "https://github.com/PoHsuanLai/quire.git", rev = "9ddcbceecbb2490526a2f5a2f3344334333d72be" }  # v0.3.33 (blitz 4b236792)
ds-desktop = { git = "https://github.com/PoHsuanLai/quire.git", rev = "9ddcbceecbb2490526a2f5a2f3344334333d72be" }  # v0.3.33 (blitz 4b236792)
ds-intents = { git = "https://github.com/PoHsuanLai/quire.git", rev = "9ddcbceecbb2490526a2f5a2f3344334333d72be" }  # v0.3.33 (blitz 4b236792)
ds-harness = { git = "https://github.com/PoHsuanLai/quire.git", rev = "9ddcbceecbb2490526a2f5a2f3344334333d72be" }  # v0.3.33 (blitz 4b236792)
ds-lint = { git = "https://github.com/PoHsuanLai/quire.git", rev = "9ddcbceecbb2490526a2f5a2f3344334333d72be" }  # v0.3.33 (blitz 4b236792)
ds-settings = { git = "https://github.com/PoHsuanLai/quire.git", rev = "9ddcbceecbb2490526a2f5a2f3344334333d72be" }  # v0.3.33 (blitz 4b236792)
ds-settings-page = { git = "https://github.com/PoHsuanLai/quire.git", rev = "9ddcbceecbb2490526a2f5a2f3344334333d72be" }  # v0.3.33 (blitz 4b236792)
# Copied from quire/docs/workspace-deps.toml at the rev above.
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "hooks", "signals"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proptest = "1"
# The Unicode property oracle in temor-core's sanitising tests (dev only).
icu_properties = "2"
png = "0.18"
# temor-vt (lane vt).
temor-vt-sys = { path = "crates/temor-vt-sys", default-features = false }
temor-vt = { path = "crates/temor-vt", default-features = false }
# temor-render (lane render). Versions are the ones quire's tree resolves at the pin above:
# fontique as parley 0.11 uses it, swash on the same skrifa (0.44) as vello's glifo, vello_cpu 0.1
# (the patched fork below; no second vello), wgpu 29 as quire's render stack.
fontique = "0.11"
swash = "0.2"
vello_cpu = { version = "0.1", default-features = false, features = ["std", "text", "u8_pipeline"] }
wgpu = "29"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
temor-render = { path = "crates/temor-render", default-features = false }
temor-ssh = { path = "crates/temor-ssh" }
# temor's app crates (lane app): the pure core, the pseudo-terminal, and the window.
temor-core = { path = "crates/temor-core" }
temor-pty = { path = "crates/temor-pty" }
temor-shell = { path = "crates/temor-shell" }
temor-pane = { path = "crates/temor-pane", default-features = false }
temor-ui = { path = "crates/temor-ui" }
# temor-plugins (lane plugins): P11 on bayonet. A plugin is run, never linked.
bayonet = { git = "https://github.com/PoHsuanLai/bayonet.git", rev = "2c5038dfdaa9352b0438c568856b5326eb95b818" }
temor-plugins = { path = "crates/temor-plugins" }
# temor-transfer (lane blocks): the downloads shelf's store, for "Save output".
temor-transfer = { path = "crates/temor-transfer" }
tokio = { version = "1", default-features = false, features = ["sync"] }
# temor-remote (lane remote): the wire protocol it speaks, and SHA-256 for file stamps and the helper's identity.
temor-wire = { path = "crates/temor-wire" }
# temor-ui (lane remote): the helper's client, for Tier B sessions in the window.
temor-remote = { path = "crates/temor-remote" }
sha2 = "0.10"
# The desktop's portable keymap core (actions, chords, Primary per platform); temor owns no keymap.
# anyview's viewer pane and peeks (PLAN §10, D13). Same quire as above.
anyview-core = { git = "https://github.com/PoHsuanLai/anyview.git", rev = "cf3753beaa162567714b081552f8db374b5eb520" }
anyview-fs = { git = "https://github.com/PoHsuanLai/anyview.git", rev = "cf3753beaa162567714b081552f8db374b5eb520" }
anyview-peek = { git = "https://github.com/PoHsuanLai/anyview.git", rev = "cf3753beaa162567714b081552f8db374b5eb520" }
anyview-machines = { git = "https://github.com/PoHsuanLai/anyview.git", rev = "cf3753beaa162567714b081552f8db374b5eb520" }
anyview-pane = { git = "https://github.com/PoHsuanLai/anyview.git", rev = "cf3753beaa162567714b081552f8db374b5eb520" }
chordkit = { git = "https://github.com/PoHsuanLai/chordkit.git", rev = "7b80eddb86559909eeb63b882d5563d36f5bad37" }
# The desktop shortcut sources (temor-ui reads kdeglobals and a dconf dump through them).
chordkit-gnome = { git = "https://github.com/PoHsuanLai/chordkit.git", rev = "7b80eddb86559909eeb63b882d5563d36f5bad37" }
chordkit-kde = { git = "https://github.com/PoHsuanLai/chordkit.git", rev = "7b80eddb86559909eeb63b882d5563d36f5bad37" }
# Our desktop's keymap source (keycap's daemon and keymap files), at the rev casement reads.
keycap-client = { git = "https://github.com/PoHsuanLai/keycap.git", rev = "52c66c7c768eac3b9ad6749f22ec3a43b08bd48f" }

# temor-desktop (lane desktop): the only crate that names zbus, docket or porter-client (PLAN §2).
# docket 4ec8abb locks porter 125272e (as anyview 0927e4a does), so docket and porter-client share
# one porter-core. porter-client is feature `dbus` only: no inference, no stoker.
temor-desktop = { path = "crates/temor-desktop", default-features = false }
docket-client = { git = "https://github.com/PoHsuanLai/docket.git", rev = "688dc63392d74d6252740d4b5f72b3db0243cee2", default-features = false, features = ["dbus"] }
docket-core = { git = "https://github.com/PoHsuanLai/docket.git", rev = "688dc63392d74d6252740d4b5f72b3db0243cee2" }
# Who may call temor's provider (intentd's unit), and the stand-in a test names for it.
docket-dbus = { git = "https://github.com/PoHsuanLai/docket.git", rev = "688dc63392d74d6252740d4b5f72b3db0243cee2" }
prov = { git = "https://github.com/PoHsuanLai/porter.git", rev = "b2adc64da9ce49b41c83c73888a7d4da9e57a8bf" }
porter-core = { git = "https://github.com/PoHsuanLai/porter.git", rev = "b2adc64da9ce49b41c83c73888a7d4da9e57a8bf" }
porter-client = { git = "https://github.com/PoHsuanLai/porter.git", rev = "b2adc64da9ce49b41c83c73888a7d4da9e57a8bf", default-features = false, features = ["dbus"] }
# The Secret Service store a Space's secrets are kept in (temor-desktop only), under temor's own name.
porter-secrets = { git = "https://github.com/PoHsuanLai/porter.git", rev = "b2adc64da9ce49b41c83c73888a7d4da9e57a8bf", features = ["oo7"] }
# zbus on tokio, as docket and porter build it (quire CONSUMING §1: a program that owns a tokio runtime).
# peephole: which program is calling (a pinned process judged against a table), as porter and
# docket use it, by the same tag; temor-desktop checks the caller of `org.quire.Temor1.Run` with it.
peephole-bus = { git = "https://github.com/PoHsuanLai/peephole", tag = "v0.1.8", default-features = false, features = ["tokio"] }
peephole-core = { git = "https://github.com/PoHsuanLai/peephole", tag = "v0.1.8" }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
toml = "1"
# The tests of temor-desktop read bus signals as streams.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# temor-pty: openpty, spawn, resize and process groups without `unsafe` (rustix is already in quire's tree).
# temor-pty: the person's login shell through the system's account lookup (NSS: files, LDAP, sssd,
# systemd-homed), not by reading /etc/passwd.
nix = { version = "0.31", default-features = false, features = ["user"] }
rustix = { version = "1.1", default-features = false, features = ["std", "pty", "termios", "process", "fs", "event"] }
tempfile = "3"
# The plain line diff of an edit conflict (MIT/Apache-2.0; no dependencies without its optional features).
similar = { version = "2", default-features = false, features = ["text"] }

# Release binaries carry no symbol table (a third of temor's size, never loaded; a panic still
# names its file and line). Same speed.
[profile.release]
strip = true

# What a published release is built with (scripts/package.sh): one codegen unit and thin LTO let
# the compiler work across crates, for a binary about 11% smaller and as fast or faster, at about
# three more minutes of linking and a 5 GB peak. Day-to-day release builds stay on `release`.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1

# Patches apply only at a workspace root, so this root repeats quire's block verbatim.
# vello and anyrender come from our forks (github.com/PoHsuanLai/vello and /anyrender, branch
# quire-filters): the colour matrix filter, multi-threaded filter layers and CSS filter lists, so
# every CSS `filter` function paints on both backends. Move back to crates.io once upstream has
# them (blitz-kit docs/blitz-gaps.md tracks the PRs).
[patch.crates-io]
vello_common = { git = "https://github.com/PoHsuanLai/vello", rev = "3e43d4af1f1955f2efc2cd52e50350811a1386ca" }
vello_cpu = { git = "https://github.com/PoHsuanLai/vello", rev = "3e43d4af1f1955f2efc2cd52e50350811a1386ca" }
vello_hybrid = { git = "https://github.com/PoHsuanLai/vello", rev = "3e43d4af1f1955f2efc2cd52e50350811a1386ca" }
vello_sparse_shaders = { git = "https://github.com/PoHsuanLai/vello", rev = "3e43d4af1f1955f2efc2cd52e50350811a1386ca" }
glifo = { git = "https://github.com/PoHsuanLai/vello", rev = "3e43d4af1f1955f2efc2cd52e50350811a1386ca" }
anyrender = { git = "https://github.com/PoHsuanLai/anyrender", rev = "d4ae3885f89a58351ff7e99cd75d9b7de5865337" }
anyrender_vello_cpu = { git = "https://github.com/PoHsuanLai/anyrender", rev = "d4ae3885f89a58351ff7e99cd75d9b7de5865337" }
anyrender_vello_hybrid = { git = "https://github.com/PoHsuanLai/anyrender", rev = "d4ae3885f89a58351ff7e99cd75d9b7de5865337" }
wgpu_context = { git = "https://github.com/PoHsuanLai/anyrender", rev = "d4ae3885f89a58351ff7e99cd75d9b7de5865337" }
pixels_window_renderer = { git = "https://github.com/PoHsuanLai/anyrender", rev = "d4ae3885f89a58351ff7e99cd75d9b7de5865337" }
# dioxus-core 0.7.10 can spin forever in VirtualDom::wait_for_work: a task woken and then cancelled
# before it is polled (a use_resource restart) leaves an empty entry in the dirty-task queue that
# pop_task never removes. Fixed upstream in DioxusLabs/dioxus#5554 (0.8-alpha only); this fork
# (github.com/PoHsuanLai/dioxus, branch quire-0.7) backports it onto 0.7.10. Remove when quire
# moves to dioxus 0.8.
dioxus-core = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
dioxus-core-types = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
generational-box = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
subsecond = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
subsecond-types = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
